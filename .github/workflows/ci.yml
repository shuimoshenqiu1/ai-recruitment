# ============================================================
# AI招聘匹配系统 - CI/CD Pipeline
# 质量门: lint → test → build → security scan
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ──────────────────────────────────────────────────────────
  # Stage 1: 代码质量检查
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install flake8 isort black mypy

      - name: Flake8
        run: flake8 backend/app/ --max-line-length 120 --exclude __pycache__

      - name: isort (import ordering)
        run: isort --check --diff backend/app/

      - name: Black (formatting)
        run: black --check backend/app/

  # ──────────────────────────────────────────────────────────
  # Stage 2: 测试
  # ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: test_recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test_password_ci@localhost:5432/test_recruitment
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production-use-12345
          ENVIRONMENT: development
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────
  # Stage 3: 构建镜像
  # ──────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: recruitment-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: recruitment-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Stage 4: 安全扫描
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt safety pip-audit

      - name: pip-audit (vulnerability scan)
        run: pip-audit --strict --desc || true
        # 允许失败但记录，避免因上游漏洞阻塞CI

      - name: Check for hardcoded secrets
        run: |
          # 简单grep检查硬编码密钥
          if grep -rn "sk-[a-zA-Z0-9]" backend/app/ --include="*.py" | grep -v ".example" | grep -v "test"; then
            echo "::warning::Possible hardcoded API key detected"
          fi
